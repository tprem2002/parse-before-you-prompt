[project]
name = "parse-before-you-prompt-demo"
version = "0.1.0"
description = "A demo showing how parsing and structure-aware chunking affect conventional RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "azure-identity>=1.25.3",
    "chromadb==1.5.9",
    "docling-core[chunking-openai]>=2.92.0",
    "docling[rapidocr,vlm]==2.123.1",
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openai>=3.6.0",
    "orjson>=3.12.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.52",
    "streamlit==1.62.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
]
